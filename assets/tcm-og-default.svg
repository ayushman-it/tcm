<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="g1" cx="80%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#2a2a2a"/>
      <stop offset="100%" stop-color="#111111"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="rgba(255,255,255,0.04)"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#g1)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- Accent glow -->
  <ellipse cx="960" cy="180" rx="320" ry="220" fill="rgba(255,255,255,0.03)"/>

  <!-- TCM Logo badge -->
  <rect x="80" y="80" width="54" height="54" rx="14" fill="#ffffff"/>
  <text x="107" y="116" font-family="system-ui,-apple-system,sans-serif" font-size="22" font-weight="900" fill="#111111" text-anchor="middle">T</text>

  <!-- Brand name -->
  <text x="150" y="104" font-family="system-ui,-apple-system,sans-serif" font-size="18" font-weight="700" fill="rgba(255,255,255,0.5)" letter-spacing="1">THE CODE MUNK</text>
  <text x="150" y="124" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="500" fill="rgba(255,255,255,0.3)">Developer Portfolio Platform</text>

  <!-- Main headline -->
  <text x="80" y="290" font-family="system-ui,-apple-system,sans-serif" font-size="58" font-weight="900" fill="#ffffff" letter-spacing="-2">Developer</text>
  <text x="80" y="360" font-family="system-ui,-apple-system,sans-serif" font-size="58" font-weight="900" fill="#ffffff" letter-spacing="-2">Portfolio</text>

  <!-- Sub text -->
  <text x="80" y="420" font-family="system-ui,-apple-system,sans-serif" font-size="22" font-weight="400" fill="rgba(255,255,255,0.45)">Built with The Code Munk · thecodemunk.in</text>

  <!-- Feature pills -->
  <rect x="80" y="470" width="160" height="36" rx="18" fill="rgba(255,255,255,0.1)"/>
  <text x="160" y="493" font-family="system-ui,-apple-system,sans-serif" font-size="14" font-weight="600" fill="rgba(255,255,255,0.7)" text-anchor="middle">Projects</text>

  <rect x="252" y="470" width="140" height="36" rx="18" fill="rgba(255,255,255,0.1)"/>
  <text x="322" y="493" font-family="system-ui,-apple-system,sans-serif" font-size="14" font-weight="600" fill="rgba(255,255,255,0.7)" text-anchor="middle">Skills</text>

  <rect x="404" y="470" width="180" height="36" rx="18" fill="rgba(255,255,255,0.1)"/>
  <text x="494" y="493" font-family="system-ui,-apple-system,sans-serif" font-size="14" font-weight="600" fill="rgba(255,255,255,0.7)" text-anchor="middle">Certificates</text>

  <!-- Right side decoration -->
  <circle cx="1050" cy="315" r="180" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <circle cx="1050" cy="315" r="130" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <circle cx="1050" cy="315" r="80" fill="rgba(255,255,255,0.04)"/>
  <text x="1050" y="328" font-family="system-ui,-apple-system,sans-serif" font-size="48" font-weight="900" fill="rgba(255,255,255,0.15)" text-anchor="middle">&lt;/&gt;</text>

  <!-- Bottom border -->
  <rect x="0" y="618" width="1200" height="12" rx="0" fill="rgba(255,255,255,0.06)"/>
</svg>
